# pnpm 12 no longer reads the "pnpm" field in package.json, so the pins live here.
# They stop @effect/platform-node-shared floating to a release that needs a newer
# effect than the one pinned in dependencies. The npm "overrides" block in
# package.json covers anyone installing this repo with npm.
overrides:
  effect: 4.1.2
  '@effect/platform-node': 4.1.2
  '@effect/platform-node-shared': 4.1.2
allowBuilds:
  core-js: false
minimumReleaseAgeExclude:
  - '@effect/tsgo-darwin-arm64@0.64.1'
  - '@effect/tsgo-darwin-x64@0.64.1'
  - '@effect/tsgo-linux-arm64@0.64.1'
  - '@effect/tsgo-linux-arm@0.64.1'
  - '@effect/tsgo-linux-x64@0.64.1'
  - '@effect/tsgo-win32-arm64@0.64.1'
  - '@effect/tsgo-win32-x64@0.64.1'
  - '@effect/tsgo@0.64.1'
